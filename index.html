<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Goals Tracker</title>
<style>
  :root {
    --bg: #f9f9f7;
    --surface: #ffffff;
    --border: #e5e5e2;
    --text: #111;
    --muted: #888;
    --accent: #4f46e5;
    --danger: #ef4444;
    --radius: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 3rem;
  }

  /* ── Month nav ── */
  .month-nav {
    display: flex;
    align-items: center;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: .6rem 1rem;
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .month-nav button {
    background: none;
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: .35rem .65rem;
    cursor: pointer;
    font-size: 1rem;
    color: var(--text);
    line-height: 1;
    transition: background .15s;
  }
  .month-nav button:hover { background: var(--bg); }
  .month-nav-label { flex: 1; text-align: center; font-weight: 600; font-size: .95rem; }

  /* ── Main container ── */
  .page { max-width: 680px; margin: 0 auto; padding: 1.5rem 1.25rem; }

  /* ── Header ── */
  .dash-header { margin-bottom: 1.25rem; }
  .dash-header h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -.5px; }
  .dash-header h1 span { font-size: .95rem; font-weight: 400; color: var(--muted); margin-left: .5rem; }

  /* ── Stats row ── */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: .5rem;
    margin-bottom: 1rem;
  }
  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: .7rem .75rem;
  }
  .stat-label { font-size: .7rem; color: var(--muted); margin-bottom: .2rem; }
  .stat-val { font-size: 1.25rem; font-weight: 700; }

  /* ── Progress line ── */
  .progress-line { font-size: .82rem; color: var(--muted); margin-bottom: 1.5rem; }

  /* ── Section title ── */
  .section-title {
    font-size: .72rem;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: .75rem;
    padding-bottom: .4rem;
    border-bottom: 1px solid var(--border);
  }

  /* ── Goal categories ── */
  .goal-sections { display: flex; flex-direction: column; gap: 1.5rem; margin-bottom: 2rem; }

  .cat-header {
    display: flex;
    align-items: center;
    gap: .5rem;
    margin-bottom: .5rem;
  }
  .cat-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .cat-label {
    font-size: .72rem;
    font-weight: 700;
    letter-spacing: .07em;
    text-transform: uppercase;
  }
  .cat-progress-text { margin-left: auto; font-size: .7rem; color: var(--muted); }

  /* Flat goal list */
  .goal-list { display: flex; flex-direction: column; }
  .goal-row {
    display: flex;
    align-items: center;
    gap: .75rem;
    padding: .55rem 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background .1s;
  }
  .goal-row:last-child { border-bottom: none; }
  .goal-row:hover { background: #f3f3f0; margin: 0 -.5rem; padding-left: .5rem; padding-right: .5rem; border-radius: 6px; }

  /* Checkbox */
  .goal-cb {
    width: 18px; height: 18px;
    border: 1.5px solid #ccc;
    border-radius: 4px;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: .65rem;
    transition: all .15s;
    background: var(--surface);
  }
  .goal-cb.done { background: var(--accent); border-color: var(--accent); color: #fff; }

  .goal-text { flex: 1; font-size: .9rem; line-height: 1.4; }
  .goal-text.done { color: var(--muted); text-decoration: line-through; }

  .goal-del {
    background: none; border: none; cursor: pointer;
    color: #ccc; font-size: 1rem; padding: 0 .2rem;
    opacity: 0; transition: opacity .15s, color .15s;
  }
  .goal-row:hover .goal-del { opacity: 1; }
  .goal-del:hover { color: var(--danger); }
  @media (hover: none) { .goal-del { opacity: .5; } }

  /* Add goal row */
  .add-row {
    display: flex;
    gap: .5rem;
    margin-top: .6rem;
    padding: .5rem .6rem;
    background: #f0f0fe;
    border-radius: 8px;
    border: 1px dashed #c7c7f9;
  }
  .add-input {
    flex: 1;
    border: none;
    border-radius: 6px;
    padding: .35rem .5rem;
    font-size: .85rem;
    outline: none;
    background: transparent;
    color: var(--text);
  }
  .add-input::placeholder { color: #a5a5c8; }
  .add-btn {
    background: var(--accent);
    border: none;
    border-radius: 6px;
    padding: .35rem .75rem;
    font-size: .8rem;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
    transition: opacity .15s;
    white-space: nowrap;
  }
  .add-btn:hover { opacity: .85; }

  /* Editable stat */
  .stat.editable { cursor: pointer; }
  .stat.editable:hover { background: #f0f0fe; border-color: #c7c7f9; }
  .stat-edit-input {
    width: 100%;
    border: none;
    border-bottom: 2px solid var(--accent);
    font-size: 1.25rem;
    font-weight: 700;
    background: transparent;
    outline: none;
    padding: 0;
    color: var(--text);
  }

  /* ── Time allocation section ── */
  .time-section { margin-bottom: 2rem; }

  .time-legend {
    display: flex;
    flex-wrap: wrap;
    gap: .35rem .85rem;
    margin-bottom: 1rem;
  }
  .leg-item { display: flex; align-items: center; gap: .3rem; font-size: .75rem; color: var(--muted); }
  .leg-dot { width: 8px; height: 8px; border-radius: 50%; }

  /* Bar chart */
  .chart-wrap {
    display: flex;
    gap: .5rem;
    align-items: stretch;
  }
  .chart-y {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: flex-end;
    padding-bottom: 1.6rem;
    gap: 0;
  }
  .chart-y span { font-size: .65rem; color: var(--muted); line-height: 1; }

  .chart-inner {
    flex: 1;
    position: relative;
    height: 140px;
    border-bottom: 1px solid var(--border);
    border-left: 1px solid var(--border);
  }
  /* Grid lines */
  .gridline {
    position: absolute;
    left: 0; right: 0;
    border-top: 1px solid var(--border);
  }
  .bars-row {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    top: 0;
    display: flex;
    align-items: flex-end;
    padding: 0 4px;
    gap: 4px;
  }
  .bar-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    height: 100%;
  }
  .bar-fill {
    width: 100%;
    border-radius: 3px 3px 0 0;
    transition: height .4s ease, opacity .15s;
    min-height: 2px;
    cursor: pointer;
  }
  .bar-fill:hover { opacity: .82; }

  /* Bar tooltip */
  .bar-tooltip {
    position: fixed;
    background: #111;
    color: #fff;
    padding: .45rem .7rem;
    border-radius: 8px;
    font-size: .78rem;
    line-height: 1.5;
    pointer-events: none;
    opacity: 0;
    transition: opacity .15s;
    z-index: 200;
    white-space: nowrap;
    transform: translate(-50%, -110%);
  }
  .bar-tooltip.show { opacity: 1; }
  .bar-tooltip strong { display: block; font-size: .82rem; }
  .bar-label {
    font-size: .58rem;
    color: var(--muted);
    text-align: center;
    margin-top: .3rem;
    line-height: 1.2;
    word-break: break-word;
    max-width: 100%;
    transform: rotate(-35deg);
    transform-origin: top left;
    white-space: nowrap;
    position: absolute;
    bottom: -1.4rem;
  }
  .bar-col-inner {
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    position: relative;
    height: 100%;
  }
  .chart-x-labels {
    display: flex;
    padding: 0 4px;
    gap: 4px;
    margin-top: .25rem;
    height: 2.5rem;
    overflow: hidden;
  }
  .x-label {
    flex: 1;
    font-size: .58rem;
    color: var(--muted);
    text-align: center;
    transform: rotate(-35deg);
    transform-origin: top center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Edit time budget */
  .time-edit-toggle {
    margin-top: .75rem;
    background: none;
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: .35rem .75rem;
    font-size: .78rem;
    color: var(--muted);
    cursor: pointer;
    transition: background .15s;
  }
  .time-edit-toggle:hover { background: var(--surface); }

  .time-edit-panel {
    margin-top: .75rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: .85rem 1rem;
    display: none;
  }
  .time-edit-panel.open { display: block; }

  .time-edit-row {
    display: flex;
    align-items: center;
    gap: .6rem;
    padding: .4rem 0;
    border-bottom: 1px solid var(--border);
  }
  .time-edit-row:last-of-type { border-bottom: none; }
  .time-edit-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .time-edit-label { flex: 1; font-size: .84rem; }
  .time-edit-hrs { font-size: .72rem; color: var(--muted); min-width: 3rem; text-align: right; }
  .pct-input {
    width: 48px;
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: .25rem .35rem;
    font-size: .84rem;
    text-align: center;
    outline: none;
  }
  .pct-input:focus { border-color: var(--accent); }
  .pct-sym { font-size: .78rem; color: var(--muted); }

  .time-total-row {
    display: flex;
    justify-content: space-between;
    margin-top: .6rem;
    padding-top: .5rem;
    border-top: 1px solid var(--border);
    font-size: .82rem;
  }
  .total-label { color: var(--muted); }
  .total-val { font-weight: 700; }
  .total-val.ok   { color: #10b981; }
  .total-val.over { color: var(--danger); }

  .save-time-btn {
    margin-top: .65rem;
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 7px;
    padding: .5rem;
    font-size: .88rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }
  .save-time-btn:hover { opacity: .85; }

  /* ── Weekly reflection ── */
  .reflection-section { margin-bottom: 2rem; }
  .reflection-textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: .75rem;
    font-size: .88rem;
    font-family: inherit;
    line-height: 1.6;
    resize: vertical;
    min-height: 90px;
    outline: none;
    background: var(--surface);
    transition: border-color .15s;
    color: var(--text);
  }
  .reflection-textarea:focus { border-color: var(--accent); }
  .save-note-btn {
    margin-top: .5rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: .45rem 1rem;
    font-size: .84rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }
  .save-note-btn:hover { background: var(--bg); }

  /* ── Check-in button ── */
  .checkin-btn {
    display: block;
    width: 100%;
    background: none;
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    padding: .75rem;
    font-size: .9rem;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    color: var(--text);
    transition: background .15s, border-color .15s;
  }
  .checkin-btn:hover { background: var(--surface); border-color: #ccc; }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 1.5rem; left: 50%;
    transform: translateX(-50%) translateY(2rem);
    background: #111; color: #fff;
    padding: .55rem 1rem;
    border-radius: 99px;
    font-size: .82rem;
    opacity: 0; pointer-events: none;
    transition: all .25s; z-index: 999;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="month-nav">
  <button id="prev-month">&#8249;</button>
  <div class="month-nav-label" id="nav-month-label">—</div>
  <button id="next-month">&#8250;</button>
</div>

<div class="page">

  <!-- Header -->
  <div class="dash-header">
    <h1 id="header-month">— <span>self development dashboard</span></h1>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat">
      <div class="stat-label">Goals done</div>
      <div class="stat-val" id="stat-done">0/0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Progress</div>
      <div class="stat-val" id="stat-pct">0%</div>
    </div>
    <div class="stat editable" id="stat-free-card" title="Tap to edit">
      <div class="stat-label">Free hrs/mo ✎</div>
      <div class="stat-val" id="stat-free">—</div>
    </div>
    <div class="stat">
      <div class="stat-label">Days left</div>
      <div class="stat-val" id="stat-days">—</div>
    </div>
  </div>

  <div class="progress-line" id="progress-line">0 of 0 goals complete</div>

  <!-- Goals -->
  <div class="section-title" id="goals-title">GOALS</div>
  <div class="goal-sections" id="goal-sections"></div>

  <!-- Time Allocation -->
  <div class="time-section">
    <div class="section-title" id="time-title">TIME ALLOCATION</div>
    <div class="time-legend" id="time-legend"></div>
    <div class="chart-wrap">
      <div class="chart-y" id="chart-y"></div>
      <div>
        <div class="chart-inner" id="chart-inner">
          <div class="bars-row" id="bars-row"></div>
        </div>
        <div class="chart-x-labels" id="chart-x"></div>
      </div>
    </div>
    <button class="time-edit-toggle" id="time-edit-toggle">Edit budget ↓</button>
    <div class="time-edit-panel" id="time-edit-panel">
      <div id="time-edit-rows"></div>
      <div class="time-total-row">
        <span class="total-label">Total</span>
        <span class="total-val" id="time-total">0%</span>
      </div>
      <button class="save-time-btn" id="save-time-btn">Save budget</button>
    </div>
  </div>

  <!-- Weekly reflection -->
  <div class="reflection-section">
    <div class="section-title">WEEKLY REFLECTION</div>
    <textarea class="reflection-textarea" id="reflection-input"
      placeholder="How's the week going? What did you do, what did you skip, what's on your mind..."></textarea>
    <button class="save-note-btn" id="save-note-btn">Save note</button>
  </div>

  <button class="checkin-btn" id="checkin-btn">Start weekly check-in ↗</button>

</div>

<div class="bar-tooltip" id="bar-tooltip"></div>
<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, query, where, orderBy, onSnapshot,
         addDoc, updateDoc, deleteDoc, doc, setDoc, onSnapshot as snap,
         serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAvyuccZDY7rsjLlHe3vaN1VN3V5Fsr-d0",
  authDomain: "goals-tracker-012.firebaseapp.com",
  projectId: "goals-tracker-012",
  storageBucket: "goals-tracker-012.firebasestorage.app",
  messagingSenderId: "659330489874",
  appId: "1:659330489874:web:517bca63216cf6354882cb"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

// ── Constants ─────────────────────────────────────────────────────────────────

const GOAL_CATS = [
  { key: "work",     label: "Career",              color: "#6366f1" },
  { key: "health",   label: "Health & Wellness",   color: "#10b981" },
  { key: "habits",   label: "Personal Growth",     color: "#ec4899" },
  { key: "home",     label: "Home / Apartment",    color: "#0d9488" },
  { key: "learning", label: "Learning & Skills",   color: "#3b82f6" },
  { key: "finance",  label: "Finances",            color: "#8b5cf6" },
];

const DEFAULT_TIME = [
  { label: "Free / Buffer",    color: "#9ca3af", pct: 25 },
  { label: "Career",           color: "#6366f1", pct: 20 },
  { label: "Health & Wellness",color: "#10b981", pct: 15 },
  { label: "Relationships",    color: "#ec4899", pct: 15 },
  { label: "Personal Growth",  color: "#3b82f6", pct: 10 },
  { label: "Hobbies",          color: "#f59e0b", pct: 10 },
  { label: "Home / Apt",       color: "#065f46", pct: 3  },
  { label: "Finances",         color: "#84cc16", pct: 2  },
];

// ── State ─────────────────────────────────────────────────────────────────────

let currentMonth = todayMonth();
let goals        = [];
let timeBudget   = DEFAULT_TIME.map(t => ({...t}));
let freeHrs      = 146;
let reflection   = "";
let unsubGoals   = null;
let unsubTime    = null;
let unsubRef     = null;

// ── Helpers ───────────────────────────────────────────────────────────────────

function todayMonth() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

function monthLabel(ym) {
  const [y, m] = ym.split("-").map(Number);
  return new Date(y, m-1, 1).toLocaleDateString("en-US", { month: "long", year: "numeric" });
}

function shortMonthLabel(ym) {
  const [y, m] = ym.split("-").map(Number);
  return new Date(y, m-1, 1).toLocaleDateString("en-US", { month: "short", year: "numeric" }).toUpperCase();
}

function shiftMonth(ym, delta) {
  const [y, m] = ym.split("-").map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
}

function daysLeftInMonth(ym) {
  const [y, m] = ym.split("-").map(Number);
  const today  = new Date();
  const end    = new Date(y, m, 0); // last day of month
  if (today.getFullYear() === y && today.getMonth() + 1 === m) {
    return end.getDate() - today.getDate();
  }
  return end.getDate(); // future month = full month
}

function escHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
}

// ── Subscriptions ─────────────────────────────────────────────────────────────

function subscribe(month) {
  if (unsubGoals) unsubGoals();
  if (unsubTime)  unsubTime();
  if (unsubRef)   unsubRef();

  // No orderBy — avoids composite index requirement; sort client-side instead
  const q = query(collection(db, "goals"), where("month", "==", month));
  unsubGoals = onSnapshot(q, s => {
    goals = s.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (a.createdAt?.seconds ?? 0) - (b.createdAt?.seconds ?? 0));
    renderGoals();
    renderStats();
  });

  unsubTime = onSnapshot(doc(db, "timeBudget", month), s => {
    if (s.exists()) {
      timeBudget = s.data().categories ?? DEFAULT_TIME.map(t => ({...t}));
      freeHrs    = s.data().freeHrs    ?? 146;
    } else {
      timeBudget = DEFAULT_TIME.map(t => ({...t}));
      freeHrs    = 146;
    }
    renderTime();
    renderStats();
  });

  unsubRef = onSnapshot(doc(db, "reflections", month), s => {
    reflection = s.exists() ? (s.data().text || "") : "";
    document.getElementById("reflection-input").value = reflection;
  });
}

// ── Goal actions ──────────────────────────────────────────────────────────────

async function addGoal(category, title) {
  await addDoc(collection(db, "goals"), {
    month: currentMonth, category, title,
    completed: false, createdAt: serverTimestamp()
  });
}
async function toggleGoal(id, current) {
  await updateDoc(doc(db, "goals", id), { completed: !current });
}
async function deleteGoal(id) {
  await deleteDoc(doc(db, "goals", id));
}

// ── Render: stats ─────────────────────────────────────────────────────────────

function renderStats() {
  const total = goals.length;
  const done  = goals.filter(g => g.completed).length;
  const pct   = total ? Math.round(done / total * 100) : 0;

  document.getElementById("stat-done").textContent = `${done}/${total}`;
  document.getElementById("stat-pct").textContent  = `${pct}%`;
  document.getElementById("progress-line").textContent = `${done} of ${total} goals complete`;
  document.getElementById("stat-days").textContent = daysLeftInMonth(currentMonth);

  // Only update if not currently being edited
  if (!document.getElementById("stat-free-input")) {
    document.getElementById("stat-free").textContent = freeHrs;
  }
}

// ── Render: goals ─────────────────────────────────────────────────────────────

function renderGoals() {
  const container = document.getElementById("goal-sections");
  container.innerHTML = "";

  for (const cat of GOAL_CATS) {
    const catGoals = goals.filter(g => g.category === cat.key);
    const catDone  = catGoals.filter(g => g.completed).length;

    const sec = document.createElement("div");
    sec.innerHTML = `
      <div class="cat-header">
        <div class="cat-dot" style="background:${cat.color}"></div>
        <div class="cat-label" style="color:${cat.color}">${cat.label}</div>
        <div class="cat-progress-text">${catDone}/${catGoals.length}</div>
      </div>
      <div class="goal-list" id="glist-${cat.key}"></div>
      <div class="add-row">
        <input class="add-input" type="text" placeholder="Add a goal…" maxlength="120"
               id="gadd-${cat.key}" autocomplete="off">
        <button class="add-btn" data-cat="${cat.key}">+ Add</button>
      </div>
    `;

    sec.querySelector(".add-btn").addEventListener("click", () => handleAdd(cat.key));
    sec.querySelector(`#gadd-${cat.key}`).addEventListener("keydown", e => {
      if (e.key === "Enter") handleAdd(cat.key);
    });
    container.appendChild(sec);

    const list = document.getElementById(`glist-${cat.key}`);
    for (const g of catGoals) {
      const row = document.createElement("div");
      row.className = "goal-row";
      row.innerHTML = `
        <div class="goal-cb ${g.completed ? 'done' : ''}">${g.completed ? '✓' : ''}</div>
        <div class="goal-text ${g.completed ? 'done' : ''}">${escHtml(g.title)}</div>
        <button class="goal-del" title="Delete">×</button>
      `;
      row.querySelector(".goal-cb").addEventListener("click", e => { e.stopPropagation(); toggleGoal(g.id, g.completed); });
      row.querySelector(".goal-text").addEventListener("click", () => toggleGoal(g.id, g.completed));
      row.querySelector(".goal-del").addEventListener("click", async e => {
        e.stopPropagation(); await deleteGoal(g.id); toast("Removed");
      });
      list.appendChild(row);
    }
  }
}

async function handleAdd(cat) {
  const input = document.getElementById(`gadd-${cat}`);
  const title = input.value.trim();
  if (!title) { input.focus(); return; }
  input.value = "";
  await addGoal(cat, title);
  toast("Goal added");
  setTimeout(() => { const el = document.getElementById(`gadd-${cat}`); if (el) el.focus(); }, 50);
}

// ── Render: time chart ────────────────────────────────────────────────────────

function renderTime() {
  const label = shortMonthLabel(currentMonth);
  document.getElementById("time-title").textContent  = `TIME ALLOCATION — ${label}`;
  document.getElementById("goals-title").textContent = `${label.split(" ")[0]} GOALS`;

  // Legend
  const legend = document.getElementById("time-legend");
  legend.innerHTML = timeBudget.map(t =>
    `<div class="leg-item"><div class="leg-dot" style="background:${t.color}"></div>${t.label} ${t.pct}%</div>`
  ).join("");

  // Chart
  const maxPct    = Math.max(30, ...timeBudget.map(t => t.pct));
  const chartMax  = Math.ceil(maxPct / 10) * 10;
  const steps     = chartMax / 10;

  // Y-axis
  const yAxis = document.getElementById("chart-y");
  yAxis.innerHTML = "";
  for (let i = steps; i >= 0; i--) {
    const s = document.createElement("span");
    s.textContent = `${i * 10}%`;
    yAxis.appendChild(s);
  }

  // Gridlines
  const inner = document.getElementById("chart-inner");
  inner.querySelectorAll(".gridline").forEach(el => el.remove());
  for (let i = 0; i <= steps; i++) {
    const gl = document.createElement("div");
    gl.className = "gridline";
    gl.style.bottom = `${(i / steps) * 100}%`;
    inner.appendChild(gl);
  }

  // Bars
  const barsRow = document.getElementById("bars-row");
  barsRow.innerHTML = "";
  const tooltip = document.getElementById("bar-tooltip");
  function showTooltip(e, t) {
    const hrs = Math.round((t.pct / 100) * freeHrs);
    tooltip.innerHTML = `<strong>${t.label}</strong>${t.pct}% · ~${hrs} hrs/mo`;
    tooltip.classList.add("show");
    moveTooltip(e);
  }
  function moveTooltip(e) {
    const x = (e.touches ? e.touches[0].clientX : e.clientX);
    const y = (e.touches ? e.touches[0].clientY : e.clientY);
    tooltip.style.left = `${x}px`;
    tooltip.style.top  = `${y}px`;
  }
  function hideTooltip() { tooltip.classList.remove("show"); }

  for (const t of timeBudget) {
    const heightPct = (t.pct / chartMax) * 100;
    const col = document.createElement("div");
    col.className = "bar-col";
    const bar = document.createElement("div");
    bar.className = "bar-col-inner";
    bar.innerHTML = `<div class="bar-fill" style="height:${heightPct}%; background:${t.color}"></div>`;
    const fill = bar.querySelector(".bar-fill");
    fill.addEventListener("mouseenter", e => showTooltip(e, t));
    fill.addEventListener("mousemove",  e => moveTooltip(e));
    fill.addEventListener("mouseleave", hideTooltip);
    fill.addEventListener("touchstart", e => { e.preventDefault(); showTooltip(e, t); }, { passive: false });
    fill.addEventListener("touchmove",  e => moveTooltip(e));
    fill.addEventListener("touchend",   () => setTimeout(hideTooltip, 1200));
    col.appendChild(bar);
    barsRow.appendChild(col);
  }

  // X labels
  const xLabels = document.getElementById("chart-x");
  xLabels.innerHTML = timeBudget.map(t =>
    `<div class="x-label">${t.label.replace(" / ", "/")}</div>`
  ).join("");

  // Edit panel
  renderTimeEdit();
}

function renderTimeEdit() {
  const rows = document.getElementById("time-edit-rows");
  rows.innerHTML = "";
  timeBudget.forEach((t, i) => {
    const hrs = Math.round((t.pct / 100) * freeHrs);
    const row = document.createElement("div");
    row.className = "time-edit-row";
    row.innerHTML = `
      <div class="time-edit-dot" style="background:${t.color}"></div>
      <div class="time-edit-label">${t.label}</div>
      <div class="time-edit-hrs" id="ehrs-${i}">~${hrs} hrs</div>
      <input class="pct-input" type="number" min="0" max="100" value="${t.pct}" data-i="${i}">
      <span class="pct-sym">%</span>
    `;
    row.querySelector(".pct-input").addEventListener("input", updateTotal);
    rows.appendChild(row);
  });
  updateTotal();
}

function updateTotal() {
  const inputs = document.querySelectorAll(".pct-input");
  let sum = 0;
  inputs.forEach(inp => {
    const v = Math.max(0, Math.min(100, Number(inp.value) || 0));
    sum += v;
    const hrs = Math.round((v / 100) * freeHrs);
    const hrsEl = document.getElementById(`ehrs-${inp.dataset.i}`);
    if (hrsEl) hrsEl.textContent = `~${hrs} hrs`;
  });
  const el = document.getElementById("time-total");
  el.textContent = `${sum}%`;
  el.className = "total-val " + (sum === 100 ? "ok" : "over");
}

async function saveTimeBudget() {
  const inputs = document.querySelectorAll(".pct-input");
  const cats = timeBudget.map((t, i) => ({
    ...t, pct: Math.max(0, Math.min(100, Number(inputs[i].value) || 0))
  }));
  await setDoc(doc(db, "timeBudget", currentMonth), { categories: cats, freeHrs });
  toast("Budget saved!");
}

// ── Reflection ────────────────────────────────────────────────────────────────

async function saveReflection() {
  const text = document.getElementById("reflection-input").value.trim();
  await setDoc(doc(db, "reflections", currentMonth), { text });
  toast("Note saved!");
}

// ── Month ─────────────────────────────────────────────────────────────────────

function setMonth(m) {
  currentMonth = m;
  const label = monthLabel(m);
  document.getElementById("nav-month-label").textContent = label;
  document.getElementById("header-month").innerHTML =
    `${label} <span>self development dashboard</span>`;
  subscribe(m);
}

// ── Events ────────────────────────────────────────────────────────────────────

document.getElementById("prev-month").addEventListener("click", () => setMonth(shiftMonth(currentMonth, -1)));
document.getElementById("next-month").addEventListener("click", () => setMonth(shiftMonth(currentMonth, 1)));
document.getElementById("save-time-btn").addEventListener("click", saveTimeBudget);
document.getElementById("save-note-btn").addEventListener("click", saveReflection);

document.getElementById("time-edit-toggle").addEventListener("click", () => {
  const panel = document.getElementById("time-edit-panel");
  const btn   = document.getElementById("time-edit-toggle");
  const open  = panel.classList.toggle("open");
  btn.textContent = open ? "Edit budget ↑" : "Edit budget ↓";
});

document.getElementById("checkin-btn").addEventListener("click", () => {
  document.getElementById("reflection-input").focus();
  document.getElementById("reflection-input").scrollIntoView({ behavior: "smooth", block: "center" });
});

// ── Editable free hrs stat card ───────────────────────────────────────────────

document.getElementById("stat-free-card").addEventListener("click", () => {
  const valEl = document.getElementById("stat-free");
  if (document.getElementById("stat-free-input")) return; // already editing
  const input = document.createElement("input");
  input.id        = "stat-free-input";
  input.type      = "number";
  input.min       = 1;
  input.max       = 730;
  input.value     = freeHrs;
  input.className = "stat-edit-input";
  valEl.replaceWith(input);
  input.select();

  async function commit() {
    const v = Math.max(1, Math.min(730, Number(input.value) || freeHrs));
    freeHrs = v;
    const span = document.createElement("div");
    span.id        = "stat-free";
    span.className = "stat-val";
    span.textContent = v;
    input.replaceWith(span);
    // Save to Firestore immediately
    const existing = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js")
      .then(m => m.getDoc(doc(db, "timeBudget", currentMonth)));
    const cats = existing.exists() ? (existing.data().categories ?? timeBudget) : timeBudget;
    await setDoc(doc(db, "timeBudget", currentMonth), { categories: cats, freeHrs: v });
    renderTimeEdit(); // refresh hrs column
    toast(`Free hrs set to ${v}`);
  }

  input.addEventListener("blur", commit);
  input.addEventListener("keydown", e => { if (e.key === "Enter") input.blur(); });
});

// ── Boot ──────────────────────────────────────────────────────────────────────

setMonth(currentMonth);
</script>
